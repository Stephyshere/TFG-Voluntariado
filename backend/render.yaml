services:
  - type: web
    name: tfg-voluntariado-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: tfg-db
          property: connectionString
      - key: FRONTEND_URL
        value: ""

databases:
  - name: tfg-db
    plan: free
